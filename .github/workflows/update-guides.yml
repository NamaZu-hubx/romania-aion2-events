name: Update AION 2 guides
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check (preview) or publish (post/update Discord)"
        required: true
        default: check
        type: choice
        options: [check, publish]
  schedule:
    - cron: '23 6 * * *'
permissions:
  contents: write
concurrency:
  group: aion2-guides
  cancel-in-progress: false
jobs:
  guides:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GUIDES_MODE: check
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements_guides.txt
      - name: Sync guides
        run: python guides_bot.py
      - name: Persist Discord message IDs even if sync partially fails
        if: always()
        run: |
          if [ -f guides_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add guides_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Save AION 2 guide sync state"
              git push
            fi
          fi
